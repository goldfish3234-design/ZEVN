name: Build ZEVN APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        run: |
          flutter create --project-name zevn --org com.zevn --platforms android _scaffold
          cp -r _scaffold/android .
          rm -rf _scaffold

      - name: Write native video picker (MainActivity.kt)
        run: |
          rm -rf android/app/src/main/kotlin android/app/src/main/java
          mkdir -p android/app/src/main/kotlin/com/zevn/zevn
          cat > android/app/src/main/kotlin/com/zevn/zevn/MainActivity.kt <<'EOF'
          package com.zevn.zevn

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "zevn/picker"
              private val requestCode = 4242
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          if (call.method == "pickVideo") {
                              pendingResult = result
                              val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                                  type = "video/*"
                                  addCategory(Intent.CATEGORY_OPENABLE)
                              }
                              startActivityForResult(
                                  Intent.createChooser(intent, "Select video"), requestCode)
                          } else {
                              result.notImplemented()
                          }
                      }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(reqCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(reqCode, resultCode, data)
                  if (reqCode == requestCode) {
                      val res = pendingResult
                      pendingResult = null
                      val uri: Uri? = data?.data
                      if (resultCode == Activity.RESULT_OK && uri != null) {
                          res?.success(copyToCache(uri))
                      } else {
                          res?.success(null)
                      }
                  }
              }

              private fun copyToCache(uri: Uri): String {
                  val file = java.io.File(cacheDir, "pick_${System.currentTimeMillis()}.mp4")
                  contentResolver.openInputStream(uri)?.use { input ->
                      file.outputStream().use { out -> input.copyTo(out) }
                  }
                  return file.absolutePath
              }
          }
          EOF

      - name: Configure app label, permissions, SDK versions
        run: |
          sed -i 's/android:label="[^"]*"/android:label="ZEVN"/' android/app/src/main/AndroidManifest.xml
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle* || true
          sed -i -E 's/compileSdk(Version)? *=? *flutter\.compileSdkVersion/compileSdk = 36/' android/app/build.gradle* || true
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ('<uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
                   '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
                   '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n    ')
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          EOF

      - name: Force all plugins to compileSdk 36
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              fun forceSdk() {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.compileSdkVersion(36)
              }
              if (state.executed) forceSdk() else afterEvaluate { forceSdk() }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects { sp ->
              def forceSdk = {
                  sp.extensions.findByName('android')?.compileSdkVersion(36)
              }
              if (sp.state.executed) { forceSdk() } else { sp.afterEvaluate { forceSdk() } }
          }
          EOF
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zevn-v1.0.${{ github.run_number }}
          name: ZEVN v1.0 (build ${{ github.run_number }})
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: ZEVN-apk
          path: build/app/outputs/flutter-apk/app-release.apk
